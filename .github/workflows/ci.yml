name: 🚦 CI/CD — Validación y Despliegue de Landing

on:
  push:
    branches:
      - main
      - gybramdev
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - gybramdev

concurrency:
  group: deploy-landing
  cancel-in-progress: false

jobs:
  validar-landing:
    name: Validar HTML y SEO
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout del repositorio
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: 📦 Instalar dependencias
        run: npm ci

      - name: 🧪 Ejecutar tests de la landing
        run: npm test

      - name: ✅ Tests completados
        if: success()
        run: echo "La landing pasó todas las validaciones correctamente."

      - name: ❌ Falló la validación
        if: failure()
        run: echo "La landing tiene errores. Revisar el reporte de tests."

  desplegar-landing:
    name: 🚀 Desplegar a Oracle Cloud
    needs: validar-landing
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout del repositorio
        uses: actions/checkout@v4

      # Los globs (*.html, *.png) hacen que cualquier pagina o imagen NUEVA se
      # despliegue sola, sin tener que acordarse de agregarla a una lista.
      - name: 📦 Armar artefacto de publicacion
        run: |
          mkdir -p dist
          cp -v *.html *.png robots.txt sitemap.xml dist/

      - name: 🔑 Preparar SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/id
          chmod 600 ~/.ssh/id
          ssh-keygen -y -f ~/.ssh/id > /dev/null \
            || { echo "::error::SSH_KEY no es una clave privada valida"; exit 1; }
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      # Sin --delete a proposito: el web root puede contener cosas ajenas al
      # repo (p. ej. .well-known de los certificados). Si se confirma que solo
      # vive la landing ahi, agregar --delete --exclude='.well-known'.
      - name: 📁 Sincronizar al servidor web (rsync)
        run: |
          rsync -azc -e "ssh -i ~/.ssh/id" \
            dist/ ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:${{ secrets.REMOTE_TARGET }}/

      - name: 🩺 Smoke test post-deploy
        run: |
          for i in $(seq 1 5); do
            if curl -sfo /dev/null --max-time 10 https://conectahorizontal.com/; then
              echo "Landing respondiendo OK"; exit 0
            fi
            echo "Intento $i/5: aun no responde, reintentando en 10s..."; sleep 10
          done
          echo "::error::La landing no respondio tras el deploy"; exit 1

